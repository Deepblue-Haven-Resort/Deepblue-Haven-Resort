<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401 - Unauthorized | Deep Blue Haven</title>

    <link rel="stylesheet" th:href="@{/assets/css/theme.css}">
    <link rel="stylesheet" th:href="@{/assets/css/base.css}">
    <link rel="stylesheet" th:href="@{/assets/css/header.css}">
    <link rel="stylesheet" th:href="@{/assets/css/footer.css}">
    <link rel="stylesheet" th:href="@{/assets/css/error.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="error-page">
        <section class="error-section">

            <div class="error-image-wrap">
                <img th:src="@{/assets/pic/401.png}" alt="401 Unauthorized" class="error-image" />
            </div>

            <div class="error-content">
                <span class="badge">401 · Guest Access Only</span>

                <h2>Your session drifted away</h2>

                <p>
                    Please sign in again
                    to continue exploring Deep Blue Haven.
                </p>

                <div class="error-actions">
                    <a th:href="@{/}" class="btn btn-cta btn-medium">
                        <i class="fa-solid fa-house btn-icon"></i>
                        <span>Home</span>
                    </a>

                    <a th:href="@{/rooms}" class="btn btn-luxury btn-medium">
                        <i class="fa-solid fa-water-ladder btn-icon"></i>
                        <span>Explore Rooms</span>
                    </a>
                </div>
            </div>

        </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
