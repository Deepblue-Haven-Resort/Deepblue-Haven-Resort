<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks | Deep Blue Haven</title>

    <link rel="stylesheet" th:href="@{/assets/css/theme.css}">
    <link rel="stylesheet" th:href="@{/assets/css/base.css}">
    <link rel="stylesheet" th:href="@{/assets/css/components.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin/dashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/housekeeper/tasks.css}">



    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<div class="admin-layout">

    <div th:replace="~{fragments/housekeeper-sidebar :: housekeeperSidebar}"></div>

    <main class="admin-main">

        <section class="account-panel">

            <div class="panel-header">
                <div>
                    <h2><strong>My Assigned Tasks</strong></h2>
                </div>
                <button class="btn btn-small btn-error">Report Issue</button>
            </div>

            <div class="filter-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search tasks by code or room number...">
                </div>

                <div class="filter-dropdown">
                    <button class="filter-btn" type="button">
                        <span class="filter-label"><strong>All Status</strong></span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="filter-menu">
                        <button type="button"><strong>All Tasks</strong></button>
                        <button type="button"><strong>Pending</strong></button>
                        <button type="button"><strong>Cleaning</strong></button>
                        <button type="button"><strong>Maintenance</strong></button>
                        <button type="button"><strong>Completed</strong></button>
                    </div>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="account-table">
                    <thead>
                    <tr>
                        <th>Task ID</th>
                        <th>Room</th>
                        <th>Task Type</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Time</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="task : ${todayTasks}">
                        <td><strong th:text="${'#HK-' + task.id}">#HK-201</strong></td>
                        <td>
                            <div class="task-room">
                                <div>
                                    <strong th:text="${task.roomNumber}">Room 204</strong>
                                    <span th:text="${task.roomType}">Deluxe Ocean View</span>
                                </div>
                            </div>
                        </td>
                        <td th:text="${task.action}">Checkout Room Cleaning</td>
                        <td><span class="role" th:classappend="${task.priorityClass}" th:text="${task.priority}">High</span></td>
                        <td><span class="status" th:classappend="${task.statusClass}" th:text="${task.statusLabel}">PENDING</span></td>
                        <td th:text="${task.timeText}">10:30 AM</td>
                        <td>
                            <form th:if="${task.statusLabel == 'PENDING'}" th:action="@{/housekeeper/tasks/{id}/start(id=${task.id})}" method="post" class="inline-action-form">
                                <button type="submit" class="btn btn-small btn-cta badge">Start</button>
                            </form>

                            <form th:if="${task.statusLabel == 'CLEANING'}" th:action="@{/housekeeper/tasks/{id}/complete(id=${task.id})}" method="post" class="inline-action-form">
                                <button type="submit" class="btn btn-small btn-success badge">Complete</button>
                            </form>

                            <button th:if="${task.statusLabel == 'INSPECTED'}" class="btn btn-small btn-luxury badge" disabled>Approved</button>

                            <button th:if="${task.statusLabel != 'PENDING' and task.statusLabel != 'CLEANING' and task.statusLabel != 'INSPECTED'}" class="btn btn-small btn-warning badge">Track</button>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(todayTasks)}">
                        <td colspan="7" class="table-empty-row">
                            No assigned tasks found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="table-footer">
                <p>Hiển thị <strong>1-5</strong> trong số <strong th:text="${#lists.size(todayTasks)}">15</strong> công việc</p>
                <div class="pagination">
                    <button type="button" class="page-btn disabled">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button type="button" class="page-btn active">1</button>
                    <button type="button" class="page-btn">2</button>
                    <span class="page-dots">...</span>
                    <button type="button" class="page-btn">3</button>
                    <button type="button" class="page-btn">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

        </section>

    </main>
</div>

<script th:src="@{/js/admin-sidebar.js}"></script>
<script th:src="@{/js/housekeeper/tasks.js}"></script>
</body>
</html>
