<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Status | Deep Blue Haven</title>

    <link rel="stylesheet" th:href="@{/assets/css/theme.css}">
    <link rel="stylesheet" th:href="@{/assets/css/base.css}">
    <link rel="stylesheet" th:href="@{/assets/css/components.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin/dashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/housekeeper/rooms.css}">



    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<div class="admin-layout">

    <div th:replace="~{fragments/housekeeper-sidebar :: housekeeperSidebar}"></div>

    <main class="admin-main">

        <section class="account-panel">

            <div class="panel-header">
                <div>
                    <h2><strong>Room Status Map</strong></h2>
                </div>
            </div>

            <!-- FILTER BAR -->
            <div class="filter-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search by room number or type...">
                </div>

                <div class="filter-dropdown">
                    <button class="filter-btn" type="button">
                        <span class="filter-label"><strong>All Statuses</strong></span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="filter-menu">
                        <button type="button"><strong>All (24)</strong></button>
                        <button type="button"><strong>Cleaning (CLEANING)</strong></button>
                        <button type="button"><strong>Available (AVAILABLE)</strong></button>
                        <button type="button"><strong>Occupied (OCCUPIED)</strong></button>
                        <button type="button"><strong>Maintenance (MAINTENANCE)</strong></button>
                    </div>
                </div>
            </div>

            <!-- ROOM GRID (Preserving ALL Original Housekeeper Fields with Mockup UI Styling) -->
            <div class="rooms-status-grid">

                <article class="chart-card room-card"
                         th:each="r : ${rooms}"
                         th:classappend="${r.status == T(deepbluehaven.pojo.enums.RoomStatus).AVAILABLE ? 'available' : (r.status == T(deepbluehaven.pojo.enums.RoomStatus).CLEANING ? 'cleaning' : (r.status == T(deepbluehaven.pojo.enums.RoomStatus).OCCUPIED ? 'occupied' : 'maintenance'))}"
                         th:data-status="${r.status}">
                    <div>
                        <div class="room-header">
                            <span class="room-number" th:text="|Room ${r.roomNumber}|">Room 101</span>
                            <span class="badge-status"
                                  th:classappend="${r.status == T(deepbluehaven.pojo.enums.RoomStatus).AVAILABLE ? 'available' : (r.status == T(deepbluehaven.pojo.enums.RoomStatus).CLEANING ? 'cleaning' : (r.status == T(deepbluehaven.pojo.enums.RoomStatus).OCCUPIED ? 'occupied' : 'maintenance'))}"
                                  th:text="${r.status}">AVAILABLE</span>
                        </div>

                        <div class="room-type" th:text="|${r.roomType} · Floor ${r.roomNumber != null && r.roomNumber.length() > 0 ? r.roomNumber.substring(0,1) : 1}|">
                            Superior King · Floor 1
                        </div>

                        <div class="room-guest-info">
                            <div>
                                <strong class="body-3" th:text="|Max ${r.capacity != null ? r.capacity : 2} Guests|">2 Guests</strong>
                                <span th:text="${r.status == T(deepbluehaven.pojo.enums.RoomStatus).AVAILABLE ? 'Ready for guests' : (r.status == T(deepbluehaven.pojo.enums.RoomStatus).CLEANING ? 'Cleaning needed' : 'Occupied / In Use')}">Status note</span>
                            </div>
                        </div>

                        <div class="room-footer-row text-center">
                            <a th:href="@{/housekeeper/tasks}" class="btn btn-small btn-cta w-100">View Tasks</a>
                        </div>
                    </div>
                </article>

                <div th:if="${#lists.isEmpty(rooms)}" class="empty-table-cell">
                    No rooms currently in inventory.
                </div>

            </div>

        </section>

    </main>
</div>

<script th:src="@{/assets/js/admin/admin-sidebar.js}"></script>
<script th:src="@{/assets/js/housekeeper/rooms.js}"></script>
</body>
</html>
