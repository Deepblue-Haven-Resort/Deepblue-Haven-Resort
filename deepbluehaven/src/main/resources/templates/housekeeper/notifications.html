<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_context_path" th:content="@{/}" />
    <title>Worker Notifications | Deep Blue Haven</title>

    <link rel="stylesheet" th:href="@{/assets/css/theme.css}">
    <link rel="stylesheet" th:href="@{/assets/css/base.css}">
    <link rel="stylesheet" th:href="@{/assets/css/components.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin/dashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/housekeeper/notifications.css}">



    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<div class="admin-layout">

    <div th:replace="~{fragments/housekeeper-sidebar :: housekeeperSidebar(activePage='notifications')}"></div>

    <main class="admin-main">

        <section class="account-panel">
            <div class="panel-header">
                <div>
                    <h2><strong>Worker Notifications</strong></h2>
                </div>
                <button type="button" class="btn btn-small btn-cta" id="btnReadAllWorker">
                    <i class="fa-solid fa-check-double"></i> Mark all as read
                </button>
            </div>

            <div class="worker-notify-panel">
                <div id="workerNotifyList">
                    <div class="worker-notify-empty">
                        <i class="fa-solid fa-spinner fa-spin"></i> Loading notifications...
                    </div>
                </div>
            </div>
        </section>

    </main>

</div>

<script th:src="@{/js/admin-sidebar.js}"></script>
<script th:src="@{/js/housekeeper/notifications.js}"></script>
</body>
</html>
