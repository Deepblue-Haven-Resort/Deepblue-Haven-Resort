<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task History | Deep Blue Haven</title>

    <link rel="stylesheet" th:href="@{/assets/css/theme.css}">
    <link rel="stylesheet" th:href="@{/assets/css/base.css}">
    <link rel="stylesheet" th:href="@{/assets/css/components.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin/dashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/housekeeper/history.css}">



    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<div class="admin-layout">

    <div th:replace="~{fragments/housekeeper-sidebar :: housekeeperSidebar}"></div>

    <main class="admin-main">

        <section class="account-panel">

            <div class="panel-header">
                <div>
                    <h2><strong>Completed Task History</strong></h2>
                </div>
                <a th:href="@{/housekeeper/history/export}" class="btn btn-small btn-cta">
                    Export Log
                </a>
            </div>

            <div class="table-wrapper">
                <table class="account-table">
                    <thead>
                    <tr>
                        <th>Log ID</th>
                        <th>Room</th>
                        <th>Task</th>
                        <th>Completion Time</th>
                        <th>Inspector</th>
                        <th>Result</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="item : ${historyTasks}">
                        <td><strong th:text="${item.taskCode}">#LOG-8801</strong></td>
                        <td>
                            <div class="task-room">
                                <div>
                                    <strong th:text="${item.roomNumber}">Room 101</strong>
                                    <span th:text="${item.roomType}">Superior King</span>
                                </div>
                            </div>
                        </td>
                        <td th:text="${item.action}">New Arrival Cleaning</td>
                        <td th:text="${item.timeText}">Today, 09:15 AM</td>
                        <td th:text="${item.assignedByName}">Tran Hoang Nam (Manager)</td>
                        <td>
                            <span class="status status-success" th:text="${item.resultText}">Passed</span>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(historyTasks)}">
                        <td colspan="6" class="table-empty-row">
                            No completed housekeeping history found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="table-footer">
                <p>Hiển thị <strong>1-5</strong> trong số <strong th:text="${#lists.size(historyTasks)}">12</strong> công việc hoàn thành</p>
                <div class="pagination">
                    <button type="button" class="page-btn disabled">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button type="button" class="page-btn active">1</button>
                    <button type="button" class="page-btn">2</button>
                    <span class="page-dots">...</span>
                    <button type="button" class="page-btn">3</button>
                    <button type="button" class="page-btn">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

        </section>

    </main>
</div>

<script th:src="@{/assets/js/admin/admin-sidebar.js}"></script>
<script th:src="@{/assets/js/housekeeper/history.js}"></script>
</body>
</html>
