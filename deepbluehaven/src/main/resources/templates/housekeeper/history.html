<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task History | Deep Blue Haven</title>

    <link rel="stylesheet" th:href="@{/assets/css/theme.css}">
    <link rel="stylesheet" th:href="@{/assets/css/base.css}">
    <link rel="stylesheet" th:href="@{/assets/css/components.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin/dashboard.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<div class="admin-layout">

    <div th:replace="~{fragments/housekeeper-sidebar :: housekeeperSidebar}"></div>

    <main class="admin-main">

        <section class="account-panel">

            <div class="panel-header">
                <div>
                    <h2><strong>Completed Task History</strong></h2>
                </div>
                <a th:href="@{/housekeeper/history/export}" class="btn btn-small btn-cta btn-link-clean">
                    <i class="fa-solid fa-file-export"></i> Export Log
                </a>
            </div>

            <div class="table-wrapper">
                <table class="account-table">
                    <thead>
                    <tr>
                        <th>Log ID</th>
                        <th>Room</th>
                        <th class="text-left">Task</th>
                        <th>Completion Time</th>
                        <th>Inspector</th>
                        <th>Result</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="item : ${historyTasks}">
                        <td><strong th:text="${item.taskCode}">#LOG-8801</strong></td>
                        <td>
                            <div class="task-room">
                                <div class="room-icon"><i class="fa-solid fa-bed"></i></div>
                                <div>
                                    <strong th:text="${item.roomNumber}">Room 101</strong>
                                    <span th:text="${item.roomType}">Superior King</span>
                                </div>
                            </div>
                        </td>
                        <td class="text-left" th:text="${item.action}">New Arrival Cleaning</td>
                        <td th:text="${item.timeText}">Today, 09:15 AM</td>
                        <td th:text="${item.assignedByName}">Tran Hoang Nam (Manager)</td>
                        <td>
                            <span class="status status-success">
                                <i class="fa-solid fa-check"></i> <span th:text="${item.resultText}">Passed</span>
                            </span>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(historyTasks)}">
                        <td colspan="6" class="table-empty-row">
                            No completed housekeeping history found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>
</div>

<script th:src="@{/js/admin-sidebar.js}"></script>
<script th:src="@{/js/housekeeper/history.js}"></script>
</body>
</html>
