<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manager Settings | Deep Blue Haven</title>

    <link rel="stylesheet" th:href="@{/assets/css/theme.css}">
    <link rel="stylesheet" th:href="@{/assets/css/base.css}">
    <link rel="stylesheet" th:href="@{/assets/css/components.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin/setting-admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="admin-layout">
        <div th:replace="~{fragments/manager-sidebar :: managerSidebar}"></div>
        <main class="admin-main">
            <div class="setting-card">
                <div class="setting-title">
                    <i class="fa-solid fa-palette"></i>
                    <h3>Appearance</h3>
                </div>
                <div class="setting-row">
                    <strong>Theme Mode</strong>
                    <div class="theme-switch">
                        <button class="theme-btn active">
                            <i class="fa-solid fa-sun"></i>
                            Light
                        </button>
                        <button class="theme-btn">
                            <i class="fa-solid fa-moon"></i>
                            Dark
                        </button>
                    </div>
                </div>
            </div>

            <div class="setting-card">
                <div class="setting-title">
                    <i class="fa-solid fa-language"></i>
                    <h3>Language & Region</h3>
                </div>
                <div class="setting-row">
                    <strong>Display Language</strong>
                    <select>
                        <option value="en" selected>English</option>
                        <option value="vi">Vietnamese</option>
                    </select>
                </div>
                <div class="setting-row">
                    <strong>Currency</strong>
                    <select>
                        <option value="USD" selected>USD ($)</option>
                        <option value="VND">VND (₫)</option>
                    </select>
                </div>
            </div>

            <div class="setting-card">
                <div class="setting-title">
                    <i class="fa-solid fa-bell"></i>
                    <h3>Notifications</h3>
                </div>
                <div class="setting-row">
                    <strong>New Booking Alert</strong>
                    <label class="toggle">
                        <input type="checkbox" checked>
                        <span></span>
                    </label>
                </div>
                <div class="setting-row">
                    <strong>Revenue & Daily Report Alert</strong>
                    <label class="toggle">
                        <input type="checkbox" checked>
                        <span></span>
                    </label>
                </div>
            </div>

            <div class="setting-card">
                <div class="setting-title">
                    <i class="fa-solid fa-shield-halved"></i>
                    <h3>Account & Security</h3>
                </div>
                <div class="setting-row">
                    <strong>Auto Logout Idle Session</strong>
                    <label class="toggle">
                        <input type="checkbox" checked>
                        <span></span>
                    </label>
                </div>
                <div class="setting-row">
                    <strong>Session Timeout</strong>
                    <select>
                        <option value="30" selected>30 minutes</option>
                        <option value="60">60 minutes</option>
                        <option value="120">2 hours</option>
                    </select>
                </div>
            </div>

            <div class="logout-card">
                <a th:href="@{/staff-logout}">
                    <button type="button">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </button>
                </a>
            </div>
        </main>
    </div>

    <script th:src="@{/assets/js/manager/manager-sidebar.js}"></script>
    <script th:src="@{/assets/js/admin/setting-admin.js}"></script>
</body>

</html>
