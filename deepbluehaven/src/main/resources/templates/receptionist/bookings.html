<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations & Bookings | Deep Blue Haven</title>

    <link rel="stylesheet" th:href="@{/assets/css/theme.css}">
    <link rel="stylesheet" th:href="@{/assets/css/base.css}">
    <link rel="stylesheet" th:href="@{/assets/css/components.css}">
    <!-- ĐỔI ĐƯỜNG DẪN CSS SANG ADMIN-SIDEBAR -->
    <link rel="stylesheet" th:href="@{/assets/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin/dashboard.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<div class="admin-layout">

    <div th:replace="~{fragments/receptionist-sidebar :: receptionistSidebar}"></div>

    <main class="admin-main">

        <section class="account-panel">

            <div class="panel-header">
                <div>
                    <h2><strong>All Reservations</strong></h2>
                </div>
                <div style="display: flex; align-items: center; gap: var(--space-12);">
                    <button class="btn btn-small btn-cta">
                        New Reservation
                    </button>
                </div>
            </div>

            <div class="filter-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search by guest name, phone, or reservation code...">
                </div>

                <div class="filter-dropdown">
                    <button class="filter-btn" type="button">
                        <span class="filter-label"><strong>All Statuses</strong></span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="filter-menu">
                        <button type="button"><strong>All Statuses</strong></button>
                        <button type="button"><strong>CONFIRMED</strong></button>
                        <button type="button"><strong>CHECKED_IN</strong></button>
                        <button type="button"><strong>CHECKED_OUT</strong></button>
                        <button type="button"><strong>CANCELLED</strong></button>
                    </div>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="account-table">
                    <thead>
                    <tr>
                        <th>Booking Ref</th>
                        <th>Guest Name</th>
                        <th>Room Type</th>
                        <th>Check-in</th>
                        <th>Check-out</th>
                        <th>Total Amount</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="b : ${bookings}">
                        <td><strong th:text="${b.bookingCode}">#BK-9021</strong></td>
                        <td>
                            <div class="user-info">
                                <div>
                                    <strong th:text="${b.guestName}">Alexander Wright</strong>
                                    <span th:text="${b.guestEmail}">alex.wright@example.com</span>
                                </div>
                            </div>
                        </td>
                        <td th:text="|${b.roomType} (${b.roomNumber})|">Ocean Villa (304)</td>
                        <td th:text="${b.checkIn != null ? #temporals.format(b.checkIn, 'dd MMM yyyy') : 'N/A'}">03 Aug 2026</td>
                        <td th:text="${b.checkOut != null ? #temporals.format(b.checkOut, 'dd MMM yyyy') : 'N/A'}">06 Aug 2026</td>
                        <td th:text="|${#numbers.formatDecimal(b.totalAmountVnd, 0, 'COMMA', 0, 'POINT')} VND|">1,450,000 VND</td>
                        <td>
                            <span th:class="|status ${b.rawStatus == T(deepbluehaven.pojo.enums.BookingStatus).CONFIRMED ? 'status-success' : (b.rawStatus == T(deepbluehaven.pojo.enums.BookingStatus).CHECKED_IN ? 'status-info' : (b.rawStatus == T(deepbluehaven.pojo.enums.BookingStatus).CANCELLED ? 'status-error' : 'status-warning'))}|"
                                  th:text="${b.rawStatus}">CONFIRMED</span>
                        </td>
                        <td>
                            <form th:if="${b.rawStatus == T(deepbluehaven.pojo.enums.BookingStatus).PENDING}"
                                  th:action="@{'/receptionist/confirm-booking/' + ${b.id}}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-small btn-cta">Confirm</button>
                            </form>
                            <span th:if="${b.rawStatus != T(deepbluehaven.pojo.enums.BookingStatus).PENDING}"
                                  th:text="${b.rawStatus}">Active</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(bookings)}">
                        <td colspan="8" style="text-align: center; padding: 24px; color: var(--gray-500);">No reservations found in system.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="table-footer">
                <p>Showing <strong>1-4</strong> of <strong>45</strong> entries</p>

                <div class="pagination">
                    <button type="button" class="page-btn disabled">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>

                    <button type="button" class="page-btn active">1</button>
                    <button type="button" class="page-btn">2</button>
                    <button type="button" class="page-btn">3</button>

                    <button type="button" class="page-btn">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

        </section>

    </main>
</div>

<!-- ĐỔI ĐƯỜNG DẪN JS SANG ADMIN-SIDEBAR -->
<script th:src="@{/assets/js/admin/admin-sidebar.js}"></script>
</body>
</html>
