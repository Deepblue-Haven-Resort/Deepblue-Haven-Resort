<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:fragment="forgotPasswordModal">
    <div class="auth-modal" id="forgotPasswordModal" aria-hidden="true">
        <div class="auth-modal__overlay" data-close-forgot></div>

        <div class="auth-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="forgotPasswordTitle">
            <button type="button" class="auth-modal__close" data-close-forgot aria-label="Close popup">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="auth-modal__icon">
                <i class="fa-solid fa-envelope-circle-check"></i>
            </div>

            <h3 class="auth-modal__title" id="forgotPasswordTitle">
                Forgot your password?
            </h3>

            <p class="auth-modal__desc">
                Enter your email address or phone number and we’ll send you a verification code.
            </p>

            <form id="forgotPasswordForm" class="auth-modal__form">
                <label class="auth-field auth-modal__field" for="forgotIdentity">
                    <span>Email or phone number</span>
                    <input
                            id="forgotIdentity"
                            name="forgotIdentity"
                            type="text"
                            placeholder="Enter your email or phone number"
                            autocomplete="username"
                            required />
                </label>

                <p class="auth-modal__error" id="forgotIdentityError"></p>

                <div class="auth-modal__actions">
                    <button type="button" class="btn btn-cta btn-medium" data-close-forgot>
                        Cancel
                    </button>

                    <button type="submit" class="btn btn-luxury btn-medium ">
                        Send code
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>

</html>
