<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
    <meta name="_context_path" th:content="@{/}" />
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
    <title>Register | Deep Blue Haven</title>

    <link rel="stylesheet" th:href="@{/assets/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/base.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/header.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/components.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/auth/auth.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/toast.css}" />

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
<div th:fragment="resetPasswordModal">
    <div class="auth-modal" id="resetPasswordModal" aria-hidden="true">
        <div class="auth-modal__overlay" data-close-reset></div>

        <div class="auth-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="resetPasswordTitle">
            <button type="button" class="auth-modal__close" data-close-reset aria-label="Close popup">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="auth-modal__icon">
                <i class="fa-solid fa-key"></i>
            </div>

            <h3 class="auth-modal__title" id="resetPasswordTitle">
                Create new password
            </h3>

            <p class="auth-modal__desc">
                Your new password must be different from previous used passwords.
            </p>

            <form id="resetPasswordForm" class="auth-modal__form">
                
                <label class="auth-field auth-modal__field" for="newPassword">
                    <span>New Password</span>
                    <input id="newPassword" name="newPassword" type="password" placeholder="Enter new password" required />
                    <button type="button" class="auth-password-toggle" data-toggle-password="newPassword">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </label>

                <label class="auth-field auth-modal__field" for="confirmNewPassword">
                    <span>Confirm Password</span>
                    <input id="confirmNewPassword" name="confirmNewPassword" type="password" placeholder="Confirm new password" required />
                    <button type="button" class="auth-password-toggle" data-toggle-password="confirmNewPassword">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </label>

                <p class="auth-modal__error" id="resetPasswordError"></p>

                <div class="auth-modal__actions" style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-cta btn-medium" style="width: 100%;">
                        Reset Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/toast :: toast}"></div>
<script th:src="@{/assets/js/auth/register.js}"></script>

</body>
</html>
