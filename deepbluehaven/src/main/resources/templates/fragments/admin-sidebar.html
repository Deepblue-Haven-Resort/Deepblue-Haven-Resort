<aside th:fragment="adminSidebar" class="admin-sidebar" id="adminSidebar">

    <button class="sidebar-toggle" id="sidebarToggle" type="button">
        <i class="fa-solid fa-bars"></i>
    </button>

    <nav class="sidebar-menu">

        <a th:href="@{/admin/dashboard}"
           th:class="${activePage == 'dashboard'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-chart-line"></i>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/admin/accounts}"
           th:class="${activePage == 'accounts'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-users-gear"></i>
            <span>Quản lý tài khoản</span>
        </a>

        <a th:href="@{/admin/roles}"
           th:class="${activePage == 'roles'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-user-shield"></i>
            <span>Phân quyền</span>
        </a>

        <a th:href="@{/admin/reports}"
           th:class="${activePage == 'reports'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-file-lines"></i>
            <span>Báo cáo</span>
        </a>

    </nav>

    <div class="sidebar-footer">

        <a th:href="@{/settings}" class="sidebar-item">
            <i class="fa-solid fa-gear"></i>
            <span>Cài đặt</span>
        </a>

        <a th:href="@{/logout}" class="sidebar-item logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Đăng xuất</span>
        </a>

    </div>

</aside>
