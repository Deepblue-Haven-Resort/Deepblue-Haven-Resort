<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="offerDetailModal"
     class="offer-detail-modal"
     id="offerDetailModal"
     aria-hidden="true">

    <div class="offer-detail-modal__overlay" data-close-offer-detail></div>
    <div class="offer-detail-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalOfferTitle">
        
        <button type="button" class="offer-detail-modal__close" data-close-offer-detail aria-label="Close offer details">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <header class="offer-detail-modal__header">
            <div class="offer-detail-modal__top-row">
                <span class="offers-eyebrow" id="modalOfferCategory">Room Offer</span>
                <span class="offer-card__badge offer-detail-modal__badge" id="modalOfferBadge">25% OFF</span>
            </div>
            <h2 id="modalOfferTitle" class="offer-detail-modal__title">SEED01</h2>
        </header>

        <div class="offer-detail-modal__body">
            <p id="modalOfferDescription" class="offer-detail-modal__description"></p>

            <div class="offer-detail-modal__info-grid">
                <div class="offer-detail-modal__info-item">
                    <span class="info-label">Validity</span>
                    <strong id="modalOfferValidity" class="info-value">Valid until...</strong>
                </div>
                <div class="offer-detail-modal__info-item">
                    <span class="info-label">Minimum Spend</span>
                    <strong id="modalOfferPrice" class="info-value">0 VND</strong>
                </div>
                <div class="offer-detail-modal__info-item">
                    <span class="info-label">Applicable Room</span>
                    <strong id="modalOfferRoomType" class="info-value">All Rooms</strong>
                </div>
            </div>
        </div>

        <footer class="offer-detail-modal__footer">
            <button type="button" class="offers-outline-btn" data-close-offer-detail>Close</button>
            <a th:href="@{/rooms}" class="btn btn-luxury btn-medium" style="text-decoration: none;">Book Stay</a>
        </footer>
    </div>
</div>

</body>
</html>
