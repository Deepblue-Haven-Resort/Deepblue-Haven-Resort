<link rel="stylesheet" th:href="@{/assets/css/header.css}" />

<div th:fragment="header"
     id="header"
     class="site-header"
     th:data-user-id="${session.loggedInCustomerId}">
  <a th:href="@{/}" class="header-logo" aria-label="Deep Blue Haven">
    <img th:src="@{/assets/pic/logo.png}" alt="Deep Blue Haven" />
  </a>

  <nav class="header-menu" id="menu" aria-label="Main menu">
    <a class="header-link is-active" th:href="@{/}">Home</a>
    <a class="header-link " th:href="@{/rooms}">Rooms</a>
    <a class="header-link" th:href="@{/services}">Services</a>
    <a class="header-link" th:href="@{/offers}">Offers</a>
    <a class="header-link" th:href="@{/about}">About Us</a>
    <a class="header-link" th:href="@{/contact}">Contact</a>
  </nav>

  <nav class="header-actions" id="action" aria-label="User actions">
    <button class="icon-btn notify" id="notifyBtn" type="button" title="Notifications" aria-label="Notifications"
      aria-haspopup="dialog" aria-expanded="false">
      <i class="fa-regular fa-bell"></i>
      <span class="notify-badge" id="notifyBadge"></span>
    </button>

    <div class="notify-pop" id="notifyPop" role="dialog" aria-label="Notifications">
      <div class="notify-head">
        <div class="notify-title">Notifications</div>

        <button class="notify-close" id="notifyClose" type="button" aria-label="Close notifications">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="notify-tabs" role="tablist" aria-label="Notification filters">
        <button class="notify-tab is-active" type="button" data-filter="all" role="tab" aria-selected="true">
          All
        </button>

        <button class="notify-tab" type="button" data-filter="unread" role="tab" aria-selected="false">
          Unread
        </button>
      </div>

      <div class="notify-list" id="notifyList"></div>

      <a class="notify-footer" th:href="@{/customer/notifications}">
        View all
      </a>
    </div>

    <a class=" btn btn-cta btn-small" th:href="@{/booking}" aria-label="Booking">
      Booking
    </a>

    <div class="user-menu" id="userMenu">
      <button class="icon-btn user-btn" id="userBtn" type="button" aria-label="Tài khoản" aria-haspopup="menu"
        aria-expanded="false">
        <i class="fa-regular fa-user"></i>
      </button>

      <div class="user-dropdown" id="userDropdown" role="menu">

        <!-- Chưa đăng nhập -->
        <a th:if="${session.loggedInCustomerId == null}"
          th:href="@{/login}"
          role="menuitem">
          Login
        </a>

        <!-- Đã đăng nhập -->
        <th:block th:if="${session.loggedInCustomerId != null}">

          <a th:href="@{/profile}" role="menuitem">
            Profile
          </a>

          <a th:href="@{/booking}" role="menuitem">
            Booking
          </a>

          <a th:href="@{/booking/history}" role="menuitem">
            Booking History
          </a>

          <a th:href="@{/favorites}" role="menuitem">
            Favorites
          </a>

          <div class="divider"></div>

          <form th:action="@{/logout}"
                method="post"
                class="logout-form">

            <input type="hidden"
                  th:if="${_csrf != null}"
                  th:name="${_csrf.parameterName}"
                  th:value="${_csrf.token}" />

            <button type="submit"
                    class="dropdown-logout"
                    role="menuitem">
              Logout
            </button>
          </form>
        </th:block>

      </div>
    </div>
  </nav>
</div>
