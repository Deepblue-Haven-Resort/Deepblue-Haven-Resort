<!-- Cập nhật class="admin-sidebar" và id="adminSidebar" để tương thích hoàn toàn với Javascript -->
<aside th:fragment="receptionistSidebar" class="admin-sidebar" id="adminSidebar">

    <button class="sidebar-toggle" id="sidebarToggle" type="button">
        <i class="fa-solid fa-bars"></i>
    </button>

    <nav class="sidebar-menu">

        <a th:href="@{/receptionist/dashboard}"
           th:class="${activePage == 'dashboard'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-gauge-high"></i>
            <span>Operations Desk</span>
        </a>
        
        <a th:href="@{/receptionist/check-in}"
           th:class="${activePage == 'check-in'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-key"></i>
            <span>Check-In Queue</span>
        </a>

        <a th:href="@{/receptionist/check-out}"
           th:class="${activePage == 'check-out'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-receipt"></i>
            <span>Check-Out & Folio</span>
        </a>

        <a th:href="@{/receptionist/room-grid}"
           th:class="${activePage == 'room-grid'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-border-all"></i>
            <span>Room Rack Grid</span>
        </a>

        <a th:href="@{/receptionist/guests}"
           th:class="${activePage == 'guests'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-users"></i>
            <span>Guest Directory</span>
        </a>
        <a th:href="@{/receptionist/services}"
           th:class="${activePage == 'services'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-bell-concierge"></i>
            <span>Guest Services</span>
        </a>
      
        <a th:href="@{/receptionist/tasks}"
           th:class="${activePage == 'tasks'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-broom"></i>
            <span>Room Cleaning Tasks</span>
        </a>

        <a th:href="@{/receptionist/profile}"
           th:class="${activePage == 'profile'} ? 'sidebar-item active' : 'sidebar-item'">
            <i class="fa-solid fa-user"></i>
            <span>My Profile</span>
        </a>

    </nav>

    <div class="sidebar-footer">

        <a th:href="@{/settings}" class="sidebar-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>

        <a th:href="@{/staff-logout}" class="sidebar-item logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>

    </div>

</aside>
