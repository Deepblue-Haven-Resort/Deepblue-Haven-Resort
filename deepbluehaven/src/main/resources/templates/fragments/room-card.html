<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<article
        th:fragment="roomCard(
            imageUrl,
            imageAlt,
            badge,
            roomName,
            location,
            icon,
            statusText,
            tagClass,
            bedInfo,
            bathInfo,
            sizeInfo,
            priceText,
            priceValue,
            resortValue,
            typeValue,
            guestsValue,
            viewValue,
            ratingValue,
            detailUrl
        )"
        class="room-card"
        th:attr="
            data-price=${priceValue},
            data-resort=${resortValue},
            data-type=${typeValue},
            data-guests=${guestsValue},
            data-view=${viewValue},
            data-rating=${ratingValue}
        "
>
    <div class="room-card__media">
        <img th:src="${imageUrl != null ? (imageUrl.startsWith('http') || imageUrl.startsWith('/deepbluehaven') ? imageUrl : '/deepbluehaven' + imageUrl) : ''}" th:alt="${imageAlt}">

        <span
                class="room-card__badge"
                th:if="${badge != null and !#strings.isEmpty(badge)}"
                th:text="${badge}">
            Best Seller
        </span>
    </div>

    <div class="room-card__body">
        <div class="room-card__top">
            <div>
                <h2 class="room-card__name" th:text="${roomName}">Ocean Deluxe</h2>
                <p class="room-card__location" th:text="${location}">Ocean Wing, Deepblue Haven</p>
            </div>

            <span class="room-card__tag" th:classappend="${tagClass}">
                <i class="fa-solid" th:classappend="${icon}"></i>
                <span th:text="${statusText}">Available</span>
            </span>
        </div>

        <div class="room-card__features">
            <span>
                <i class="fa-solid fa-bed"></i>
                <span th:text="${bedInfo}">1 King Bed</span>
            </span>

            <span>
                <i class="fa-solid fa-bath"></i>
                <span th:text="${bathInfo}">1 Bathroom</span>
            </span>

            <span>
                <i class="fa-solid fa-ruler-combined"></i>
                <span th:text="${sizeInfo}">42m²</span>
            </span>
        </div>

        <div class="room-card__price">
            <span>Starting from</span>
            <strong th:text="${priceText}">1,250,000 VND</strong>
            <small>/ night</small>
        </div>

        <a
                th:href="@{${detailUrl}}"
                class="btn btn-cta btn-small room-card__action">
            View Room
        </a>
    </div>
</article>

</body>
</html>
