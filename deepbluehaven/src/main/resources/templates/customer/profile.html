<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="_context_path" th:content="@{/}" />

  <title>Customer Profile | DeepBlue Haven Resort</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" th:href="@{/assets/css/theme.css}" href="/assets/css/theme.css" />
  <link rel="stylesheet" th:href="@{/assets/css/base.css}" href="/assets/css/base.css" />
  <link rel="stylesheet" th:href="@{/assets/css/header.css}" href="/assets/css/header.css" />
  <link rel="stylesheet" th:href="@{/assets/css/footer.css}" href="/assets/css/footer.css" />
  <link rel="stylesheet" th:href="@{/assets/css/customer/home.css}" href="/assets/css/customer/home.css" />
  <link rel="stylesheet" th:href="@{/assets/css/customer/profile.css}" href="/assets/css/customer/profile.css" />
  <link rel="stylesheet" th:href="@{/assets/css/toast.css}" href="/assets/css/toast.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

</head>

<body class="home-page">
  <div th:replace="~{fragments/header :: header(activePage='profile')}"></div>

<main class="customer-profile">

    <div class="container">
        <section class="profile-layout">

            <!-- Sidebar -->
            <aside class="profile-sidebar">

                <div class="profile-user">

                    <div class="profile-avatar">
                        <i class="fa-regular fa-user"></i>
                        <button type="button"
                                class="profile-avatar__edit"
                                aria-label="Change profile picture">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                    </div>

                    <h2 id="sidebarFullName" th:text="${profile != null && profile.fullName != null ? profile.fullName : 'Guest Profile'}">Guest Profile</h2>

                    <p id="sidebarEmail" th:text="${profile != null && profile.email != null ? profile.email : 'guest@deepbluehaven.com'}">guest@deepbluehaven.com</p>

                    <span class="profile-member">
                        <i class="fa-solid fa-gem"></i>
                        <span th:text="${profile != null && profile.segment != null ? profile.segment : 'Blue Member'}">Blue Member</span>
                    </span>

                </div>

                <nav class="profile-navigation"
                     aria-label="Profile navigation">

                    <button type="button"
                            class="profile-navigation__item is-active"
                            data-profile-tab="personal">

                        <i class="fa-regular fa-user"></i>
                        <span>Personal Information</span>

                    </button>

                    <a th:href="@{/booking/history}"
                       class="profile-navigation__item"
                       style="text-decoration: none;">

                        <i class="fa-regular fa-calendar-check"></i>
                        <span>My Bookings</span>

                    </a>

                </nav>

                <div class="profile-sidebar__footer">

                    <form th:action="@{/logout}" method="post" style="width: 100%;">
                        <button type="submit" class="profile-logout" style="width: 100%; border: none; background: transparent; cursor: pointer;">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            Logout
                        </button>
                    </form>

                </div>

            </aside>

            <!-- Nội dung chính -->
            <div class="profile-content">

                <!-- Personal Information -->
                <section class="profile-panel is-active"
                         id="personalPanel"
                         data-profile-panel="personal">

                    <div class="profile-panel__header">

                        <div>
                            <span class="profile-panel__label">
                                Account details
                            </span>

                            <h2>Personal Information</h2>

                            <p>
                                Update your personal information and contact details.
                            </p>
                        </div>

                        <button type="button"
                                class="btn btn-cta btn-small"
                                id="editProfileBtn">

                            <i class="fa-regular fa-pen-to-square"></i>
                            Edit Profile

                        </button>

                    </div>

                    <form class="profile-form" id="profileForm">

                        <div class="profile-form__grid">

                            <div class="profile-field">

                                <label for="fullName">
                                    Full Name
                                </label>

                                <div class="profile-input">

                                    <i class="fa-regular fa-user"></i>

                                    <input type="text"
                                           id="fullName"
                                           name="fullName"
                                           th:value="${profile != null ? profile.fullName : ''}"
                                           readonly
                                           required>

                                </div>

                            </div>

                            <div class="profile-field">

                                <label for="phone">
                                    Phone Number
                                </label>

                                <div class="profile-input">

                                    <i class="fa-solid fa-phone"></i>

                                    <input type="tel"
                                           id="phone"
                                           name="phoneNumber"
                                           th:value="${profile != null ? profile.phoneNumber : ''}"
                                           readonly>

                                </div>

                            </div>

                            <div class="profile-field">

                                <label for="email">
                                    Email Address
                                </label>

                                <div class="profile-input">

                                    <i class="fa-regular fa-envelope"></i>

                                    <input type="email"
                                           id="email"
                                           name="email"
                                           th:value="${profile != null ? profile.email : ''}"
                                           readonly>

                                </div>

                            </div>

                            <div class="profile-field">

                                <label for="birthday">
                                    Date of Birth
                                </label>

                                <div class="profile-input">

                                    <i class="fa-regular fa-calendar"></i>

                                    <input type="date"
                                           id="birthday"
                                           name="birthDay"
                                           th:value="${profile != null && profile.birthDay != null ? profile.birthDay : ''}"
                                           readonly>

                                </div>

                            </div>

                        </div>

                        <div class="profile-form__actions" id="profileFormActions">

                            <button type="button"
                                    class="profile-btn-outline"
                                    id="cancelEditBtn">

                                Cancel

                            </button>

                            <button type="submit"
                                    class="btn btn-cta btn-small">

                                <i class="fa-regular fa-floppy-disk"></i>
                                Save Changes

                            </button>

                        </div>

                    </form>

                </section>

                <!-- Booking overview -->
                <section class="profile-overview">

                    <div class="profile-overview__header">

                        <div>
                            <span class="profile-panel__label">
                                Your activity
                            </span>

                            <h2>Booking Overview</h2>
                        </div>

                        <a th:href="@{/booking/history}"
                           class="profile-view-link">

                            View history
                            <i class="fa-solid fa-arrow-right"></i>

                        </a>

                    </div>

                    <div class="profile-statistics">

                        <article class="profile-stat-card">

                            <div class="profile-stat-card__icon">
                                <i class="fa-regular fa-calendar-check"></i>
                            </div>

                            <div>
                                <strong th:text="${totalBookingsCount != null ? totalBookingsCount : 0}">0</strong>
                                <span>Total Bookings</span>
                            </div>

                        </article>

                        <article class="profile-stat-card">

                            <div class="profile-stat-card__icon">
                                <i class="fa-solid fa-bed"></i>
                            </div>

                            <div>
                                <strong th:text="${upcomingStaysCount != null ? upcomingStaysCount : 0}">0</strong>
                                <span>Active Bookings</span>
                            </div>

                        </article>

                        <article class="profile-stat-card">

                            <div class="profile-stat-card__icon">
                                <i class="fa-solid fa-star"></i>
                            </div>

                            <div>
                                <strong th:text="${profile != null && profile.totalPoints != null ? profile.totalPoints : 0}">0</strong>
                                <span>Loyalty Points</span>
                            </div>

                        </article>

                    </div>

                </section>

            </div>

        </section>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Toast fragment -->
<div th:replace="~{fragments/toast :: toast}">
    <div id="toast-container" class="toast-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script th:src="@{/js/customer/profile.js}" src="/js/customer/profile.js"></script>

</body>
</html>
