spring.application.name=deepbluehaven

# Server configuration
server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/deepbluehaven
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10485760
server.tomcat.max-swallow-size=10485760
server.tomcat.max-part-count=100
server.tomcat.max-part-header-size=8192

# Logging configuration
logging.level.org.springframework.web=DEBUG

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8

# Database configuration (SQL Server)
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=deepblue_haven;encrypt=true;trustServerCertificate=true;sendStringAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=Deepblue2026
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Naming strategy 
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Open session in view 
spring.jpa.open-in-view=true
spring.devtools.restart.enabled=false
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# Spring Session Redis
spring.session.store-type=redis
spring.session.redis.namespace=deepbluehaven:session

# Session cookie
server.servlet.session.timeout=8h
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=DEEPBLUEHAVEN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/deepbluehaven

# Cloudinary config
cloudinary.cloud_name=demo
cloudinary.api_key=demo
cloudinary.api_secret=demo

# FaceBook và Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${clientIdGoogle}
spring.security.oauth2.client.registration.google.client-secret=${clientSecretGoogle}
spring.security.oauth2.client.registration.google.scope=email, profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.registration.facebook.client-id=${clientIdFacebook}
spring.security.oauth2.client.registration.facebook.client-secret=${clientSecretFacebook}
spring.security.oauth2.client.registration.facebook.scope=public_profile, email
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.facebook.client-name=Facebook

# Cấu hình Spring Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio Verify
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}

# VNPAY Gateway Sandbox Configuration (Reads from environment variables / system properties)
vnpay.tmnCode=${VNPAY_TMN_CODE:${VNP_TMN_CODE:SUEJODFE}}
vnpay.hashSecret=${VNPAY_HASH_SECRET:${VNP_HASH_SECRET:}}
vnpay.url=${VNPAY_URL:${VNP_URL}}
vnpay.returnUrl=${VNPAY_RETURN_URL:${VNP_RETURN_URL}}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.orderType=250000